name: Validate Kobe Lot1
on:
  push:
    branches: [main, feat/kobe-lot1-ui]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Check whitespace
        run: git diff --check
