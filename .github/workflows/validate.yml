name: Validate Kobe
on:
  push:
    branches: [main, feat/kobe-lot1-ui, feat/kobe-lot2-combat]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Check whitespace
        run: git diff --check
  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install headless browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke (WebKit / Chromium, offline reload)
        run: node scripts/browser-smoke.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kobe-lot2-browser-evidence
          path: screenshots/
