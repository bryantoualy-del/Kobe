name: Validate Kobe
on:
  push:
    branches: [main, feat/kobe-lot1-ui, feat/kobe-lot2-combat, feat/kobe-lot3-spellbook, feat/kobe-lot4-kharvek]
  pull_request:
concurrency:
  group: validate-kobe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Check whitespace
        run: git diff --check
  browser-smoke:
    name: Browser validation · ${{ matrix.recipe_group }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        recipe_group:
          - "support-browser parity-browser"
          - "browser-smoke spellbook-browser"
          - "kharvek-browser table-browser resume-browser"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Load the tested V5 server with Kobe registered
        uses: actions/checkout@v4
        with:
          repository: bryantoualy-del/RPG-Connect
          ref: 5b13cd5f28e483088550cad3b2b893dde4ae2d3a
          path: .v5-test
          persist-credentials: false
      - name: Run canonical V5 server tests
        working-directory: .v5-test
        run: npm ci && npm test
      - name: Audited baseline for identical before/after captures
        uses: actions/checkout@v4
        with:
          ref: 0cdd548f10201cbdede87a654aac1209142dc862
          path: .before
          persist-credentials: false
      - name: Responsive comparisons and touch geometry
        run: node scripts/layout-browser.mjs
      - name: Browser smoke (WebKit / Chromium, offline reload)
        if: always()
        run: |
          failed=0
          for recipe in ${{ matrix.recipe_group }}; do
            node scripts/$recipe.mjs || failed=1
          done
          exit "$failed"

      - name: Prepare visual review
        if: always()
        run: node scripts/review-browser.mjs
      - name: Probe the currently published Pages build (independent of PR)
        if: always()
        continue-on-error: true
        run: node scripts/check-public.mjs https://bryantoualy-del.github.io/Kobe/
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kobe-lot5-browser-evidence-${{ strategy.job-index }}
          path: screenshots/
  ecosystem:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/checkout-v5.mjs
      - run: npm ci && npm test
        working-directory: .v5-env/RPG-Connect
      - run: npm ci
        working-directory: .v5-env/Encounter
      - name: Six historical Companions and MJ in real HTML, and canonical authorities
        working-directory: .v5-env/Encounter
        run: |
          npm run test:v5
          node --test rpg-brack-authority.test.js rpg-samoth-automatismes.test.js rpg-zephyr-authority.test.js rpg-kentaro-authority.test.js rpg-rufus-authority.test.js rpg-nans-authority.test.js rpg-effective-damage.test.js
      - run: npm run build && node scripts/table-ecosystem.mjs
